<title>Quizzes | QuizForge</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f5f7fb;
        color: #172033;
    }

    /* NAVBAR */

    nav {
        height: 70px;
        background: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 8%;
        border-bottom: 1px solid #e5e7eb;
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
        color: #2563eb;
        text-decoration: none;
    }

    .nav-links {
        display: flex;
        gap: 30px;
    }

    .nav-links a {
        text-decoration: none;
        color: #4b5563;
    }

    .nav-links a:hover {
        color: #2563eb;
    }

    /* PAGE */

    .container {
        max-width: 900px;
        margin: 70px auto;
        padding: 0 25px;
    }

    .heading {
        text-align: center;
        margin-bottom: 40px;
    }

    .heading h1 {
        font-size: 42px;
        margin-bottom: 12px;
    }

    .heading p {
        color: #6b7280;
        font-size: 17px;
    }

    /* QUIZ LIST */

    .quiz-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .quiz {
        display: block;
        background: white;
        padding: 22px 25px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        text-decoration: none;
        color: #172033;
        font-size: 18px;
        font-weight: bold;
        transition: 0.2s;
    }

    .quiz:hover {
        border-color: #2563eb;
        transform: translateX(5px);
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
    }

    /* FOOTER */

    footer {
        margin-top: 100px;
        padding: 30px;
        text-align: center;
        background: white;
        border-top: 1px solid #e5e7eb;
        color: #6b7280;
        font-size: 14px;
    }

    @media (max-width: 600px) {
        .heading h1 {
            font-size: 34px;
        }

        .nav-links {
            gap: 12px;
        }
    }
</style>
```
